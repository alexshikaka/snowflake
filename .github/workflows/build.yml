name: Сборка установщика

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Пакеты программы
        run: |
          python -m pip install --upgrade pip
          python -m pip install pystray pillow winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Media.Control
          python -c "import pystray, PIL; import winrt.windows.media.control; print('packages ok')"

      # Свой загрузчик PyInstaller, собранный из исходников: стандартный антивирусы
      # чаще принимают за подозрительный, потому что им пользуется много чужих программ.
      - name: PyInstaller (загрузчик из исходников)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --no-binary pyinstaller "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Не вышло собрать загрузчик - ставлю обычный PyInstaller"
            python -m pip install "pyinstaller>=6.10,<7"
          }
          python -m PyInstaller --version

      - name: Версия
        id: ver
        run: |
          $v = python installer/make_version.py
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # --onedir: программа лежит в папке и не распаковывает себя во временную папку при запуске
      - name: Сборка CatPet.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name CatPet --icon app/cat.ico --version-file installer/version_info.txt
          --collect-all winrt app/cat_pet.py

      - name: Установщик (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/CatPet.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: CatPet-Setup-${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe

      - name: Выпуск на странице Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Котик ${{ steps.ver.outputs.version }}
          files: installer/Output/*.exe
          body: |
            Скачайте файл CatPet-Setup-${{ steps.ver.outputs.version }}.exe ниже и запустите его.
            Python не нужен. Права администратора не нужны.
