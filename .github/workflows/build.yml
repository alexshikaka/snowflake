name: Сборка установщика

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Пакеты программы
        run: |
          python -m pip install --upgrade pip
          python -m pip install pystray pillow winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Media.Control
          python -c "import pystray, PIL; import winrt.windows.media.control; print('packages ok')"

      # Свой загрузчик PyInstaller, собранный из исходников: стандартный антивирусы
      # чаще принимают за подозрительный, потому что им пользуется много чужих программ.
      - name: PyInstaller (загрузчик из исходников)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --no-binary pyinstaller "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Не вышло собрать загрузчик - ставлю обычный PyInstaller"
            python -m pip install "pyinstaller>=6.10,<7"
          }
          python -m PyInstaller --version

      - name: Версия
        id: ver
        run: |
          $v = python installer/make_version.py
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # --onedir: программа лежит в папке и не распаковывает себя во временную папку при запуске
      - name: Сборка CatPet.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name CatPet --icon app/cat.ico --version-file installer/version_info.txt
          --collect-all winrt app/cat_pet.py

      - name: Установщик (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/CatPet.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: CatPet-Setup-${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe

      - name: Выпуск на странице Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Котик ${{ steps.ver.outputs.version }}
          files: installer/Output/*.exe
          body: |
            Скачайте файл CatPet-Setup-${{ steps.ver.outputs.version }}.exe ниже и запустите его.
            Python не нужен. Права администратора не нужны.

  # Проверка готового установщика на чистой Windows: ставим, запускаем, удаляем.
  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: setup

      - name: Тихая установка (с автозапуском)
        run: |
          $exe = Get-ChildItem setup -Recurse -Filter *.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="autostart"' -Wait
          $app = "$env:LOCALAPPDATA\Programs\CatPet"
          Get-ChildItem $app | Format-Table Name, Length

      - name: Файлы на месте
        run: |
          $app = "$env:LOCALAPPDATA\Programs\CatPet"
          $startup = [Environment]::GetFolderPath('Startup')
          $need = @("$app\CatPet.exe", "$app\autostart\CatPet.lnk", "$startup\CatPet.lnk", "$app\unins000.exe")
          foreach ($f in $need) { if (!(Test-Path $f)) { Write-Error "нет файла: $f"; exit 1 } else { Write-Host "есть: $f" } }
          $w = Get-ChildItem "$app\_internal" -Recurse -Directory -Filter control | Where-Object { $_.FullName -like '*winrt*media*' }
          if (!$w) { Write-Error "нет пакета для музыки (winrt)"; exit 1 }
          $v = (Get-Item "$app\CatPet.exe").VersionInfo
          Write-Host "Версия: $($v.ProductVersion)  Описание: $($v.FileDescription)  Автор: $($v.CompanyName)"
          if (!$v.ProductVersion) { Write-Error "нет данных о версии"; exit 1 }

      - name: Программа запускается и работает
        run: |
          $app = "$env:LOCALAPPDATA\Programs\CatPet"
          $p = Start-Process "$app\CatPet.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "программа закрылась сама, код $($p.ExitCode)"; exit 1 }
          Write-Host "работает 20 секунд, память $([int]($p.WorkingSet64/1MB)) МБ"
          # вторая копия не должна запускаться
          $p2 = Start-Process "$app\CatPet.exe" -PassThru
          Start-Sleep -Seconds 8
          if (!$p2.HasExited) { Write-Error "запустилась вторая копия"; exit 1 }
          Write-Host "вторая копия не запустилась - правильно"
          Stop-Process -Id $p.Id -Force

      - name: Удаление не оставляет следов
        run: |
          $app = "$env:LOCALAPPDATA\Programs\CatPet"
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          $startup = [Environment]::GetFolderPath('Startup')
          if (Test-Path "$startup\CatPet.lnk") { Write-Error "остался ярлык автозапуска"; exit 1 }
          if (Test-Path "$app\CatPet.exe") { Write-Error "осталась программа"; exit 1 }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          if ($run -and $run.PSObject.Properties.Name -contains 'CatPet') { Write-Error "запись в реестре автозапуска"; exit 1 }
          Write-Host "удалено чисто"
